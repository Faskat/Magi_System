<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- F assembled out of glyphs from the background lattice:
       bars for the stem, horizontal signs for the two arms -->
  <rect width="32" height="32" rx="4" fill="#0a0c0d"/>
  <g fill="#39ffc4" font-family="ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace"
     font-size="6.4" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <!-- stem -->
    <text x="9.2" y="4.6">†</text>
    <text x="9.2" y="8.0">|</text>
    <text x="9.2" y="11.4">¦</text>
    <text x="9.2" y="14.8">‡</text>
    <text x="9.2" y="18.2">|</text>
    <text x="9.2" y="21.6">¦</text>
    <text x="9.2" y="25.0">|</text>
    <text x="9.2" y="28.4">‡</text>
    <!-- top arm -->
    <text x="12.6" y="4.6">≡</text>
    <text x="16.0" y="4.6">≈</text>
    <text x="19.4" y="4.6">≡</text>
    <text x="22.8" y="4.6">◊</text>
    <!-- middle arm -->
    <text x="12.6" y="14.8">≡</text>
    <text x="16.0" y="14.8">≈</text>
    <text x="19.4" y="14.8">◊</text>
  </g>
</svg>
